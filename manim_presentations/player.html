<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title><!--title--></title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #ddd; font: 15px/1.4 system-ui, sans-serif; }
  body { display: flex; flex-direction: column; }
  #main { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  #stage { position: relative; flex: 1; min-height: 0; min-width: 0; }
  #transcript { height: 38%; overflow-y: auto; padding: 0 16px; background: #0d0d0d; border-top: 1px solid #222; }
  #transcript h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: #888; margin: 18px 0 6px; }
  #transcript section { padding: 8px 10px; margin: 0 -10px; border-radius: 6px; cursor: pointer; }
  #transcript section.current { background: #1d2f57; }
  #transcript h3 { font-size: 15px; margin: 0 0 4px; color: #fff; }
  #transcript p { margin: 0 0 4px; white-space: pre-wrap; }
  #transcript p.note { color: #c9a227; font-style: italic; }
  @media (min-aspect-ratio: 1/1) { #main { flex-direction: row; } #transcript { width: 32%; height: auto; border-top: 0; border-left: 1px solid #222; } }  /* last: it overrides the portrait sizes above */
  #stage video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
  #bar { display: flex; gap: 8px; align-items: center; padding: 8px; background: #111; }
  #bar button { font: inherit; padding: 6px 14px; border: 1px solid #444; border-radius: 6px; background: #222; color: #eee; }
  #bar #next { background: #2a5bd7; border-color: #2a5bd7; }
  #bar select { font: inherit; flex: 1; min-width: 0; background: #222; color: #eee; border: 1px solid #444; padding: 5px; }
  body.boundary #bar { box-shadow: inset 0 0 0 3px #d33; }
  body.failed #status { color: #f66; }
</style></head>
<body>
<div id="main"><div id="stage"></div></div>
<div id="bar">
  <button id="previous" title="Previous (↑, PageUp)">▲ Previous</button>
  <button id="next" title="Next (↓, PageDown)">▼ Next</button>
  <button id="replay" title="Replay (R)">⟲ Replay</button>
  <select id="jump" aria-label="Jump to a beat"></select>
  <span id="status"></span>
</div>
<!--manifest-->
<script>
"use strict";
const M = JSON.parse(document.getElementById("manifest").textContent);
const SLUGS = M.beats.map((b) => b.slug);
const stage = document.getElementById("stage"), notice = document.getElementById("status");

// The Position model of protocol.step, kept equal to it by tests/position_table.json.
function step(position, action, slugs) {
  if (position.kind === "before") {
    return action === "next" ? {kind: "moved", position: {kind: "at", slug: slugs[0]}} : {kind: "boundary"};
  }
  const i = slugs.indexOf(position.slug);
  if (action === "next") return i + 1 < slugs.length ? {kind: "moved", position: {kind: "at", slug: slugs[i + 1]}} : {kind: "boundary"};
  if (action === "previous") return {kind: "moved", position: i ? {kind: "at", slug: slugs[i - 1]} : {kind: "before"}};
  if (action === "replay") return {kind: "moved", position};
  throw new Error("unknown action " + action);
}

// What a position shows after an action: Next and Replay play the beat; Previous and a jump show it as last seen
// (its last frame, or its loop running); Before shows beat 0's first frame.
function showFor(position, action) {
  if (position.kind === "before") return {beat: 0, frame: 0, play: false};
  const beat = SLUGS.indexOf(position.slug), b = M.beats[beat];
  const played = action === "next" || action === "replay" || b.kind === "loop";
  return {beat, frame: played ? 0 : b.frames - 1, play: played};
}

// Blob URLs exist only for the current beat and its neighbours: the shown beat's is made when it is shown, its
// neighbours' and the revocations once it is in front (so the front element never loses its source, and no
// neighbour's base64 is decoded before the shown clip has its source).
const urls = new Map();
function blobUrl(i) {
  if (!urls.has(i)) {
    const text = atob(document.getElementById("clip-" + i).textContent), bytes = new Uint8Array(text.length);
    for (let k = 0; k < text.length; k++) bytes[k] = text.charCodeAt(k);
    urls.set(i, URL.createObjectURL(new Blob([bytes], {type: "video/mp4"})));
  }
  return urls.get(i);
}
function windowAt(c) {
  for (const [i, u] of urls) if (Math.abs(i - c) > 1) { URL.revokeObjectURL(u); urls.delete(i); }
  for (let i = Math.max(0, c - 1); i <= Math.min(M.beats.length - 1, c + 1); i++) blobUrl(i);
}

// Every show is a fresh <video> under the front one: it loads, seeks paused to the middle of the wanted frame (an
// exact pts can present the frame before it), and is raised on `seeked`, so the front video stays up until the new
// frame is there. A fresh element because WebKit leaves the old frame on screen after the first paused seek of a
// video that has played. A newer show makes an older one stale; a stale element is dropped, never raised.
let front = null, shows = 0;
function release(v) { v.pause(); v.removeAttribute("src"); v.load(); v.remove(); }
function show({beat, frame, play}) {
  const mine = ++shows, v = document.createElement("video");
  v.muted = true; v.playsInline = true; v.preload = "auto"; v.loop = M.beats[beat].kind === "loop";
  v.addEventListener("loadeddata", () => { v.currentTime = (frame + 0.5) / M.fps; }, {once: true});
  v.addEventListener("seeked", () => {
    if (mine !== shows) return release(v);
    v.style.zIndex = 1;
    if (front) release(front);
    front = v;
    if (play) v.play().catch((e) => { if (e.name !== "AbortError") throw e; });  // AbortError: a newer show paused it
    windowAt(beat);  // after play(): a neighbour's decode never delays the start
  }, {once: true});
  v.addEventListener("error", () => {
    if (mine !== shows) return release(v);
    document.body.classList.add("failed");
    notice.textContent = `${M.beats[beat].title}: the clip failed to load`;
    v.remove();  // the front video, and its frame, stay
    throw new Error(`clip ${beat} failed to load`);
  });
  v.src = blobUrl(beat);
  stage.prepend(v);
}

// The transcript panel exists only when the export carries one; its entries are built as text, never as markup.
const entries = new Map();
if (M.transcript !== "none") {
  const panel = document.createElement("aside");
  panel.id = "transcript";
  for (const [slug, title] of M.chapters) {
    panel.append(Object.assign(document.createElement("h2"), {textContent: title}));
    for (const b of M.beats.filter((b) => b.chapter === slug)) {
      const entry = document.createElement("section");
      entry.append(Object.assign(document.createElement("h3"), {textContent: b.title}));
      entry.append(Object.assign(document.createElement("p"), {textContent: b.narration}));
      if (b.notes) entry.append(Object.assign(document.createElement("p"), {className: "note", textContent: b.notes}));
      entry.addEventListener("click", () => act("jump", {kind: "at", slug: b.slug}));
      entries.set(b.slug, entry);
      panel.append(entry);
    }
  }
  document.getElementById("main").append(panel);
  const toggle = Object.assign(document.createElement("button"), {id: "toggle", textContent: "Transcript"});
  toggle.addEventListener("click", () => { panel.hidden = !panel.hidden; });
  document.getElementById("bar").append(toggle);
}
function highlight() {  // Before is beat 0's first frame, so beat 0's text is the one on screen
  const slug = position.kind === "at" ? position.slug : SLUGS[0];
  for (const [s, entry] of entries) entry.classList.toggle("current", s === slug);
  entries.get(slug)?.scrollIntoView({block: "nearest"});
}

let position = {kind: "before"}, flashing = 0;
function act(action, to) {
  const r = to ? {kind: "moved", position: to} : step(position, action, SLUGS);
  if (r.kind === "boundary") {
    document.body.classList.add("boundary");
    clearTimeout(flashing);
    flashing = setTimeout(() => document.body.classList.remove("boundary"), 300);  // judgement: seen, gone by the next press
    return;
  }
  position = r.position;
  jump.value = position.kind === "at" ? position.slug : "";
  highlight();
  show(showFor(position, action));
}

const jump = document.getElementById("jump");
jump.append(Object.assign(new Option("Before the first beat", ""), {disabled: true}));  // shown at Before only
for (const [slug, title] of M.chapters) {
  const group = document.createElement("optgroup");
  group.label = title;
  for (const b of M.beats) if (b.chapter === slug) group.append(new Option(b.title, b.slug));
  jump.append(group);
}
jump.addEventListener("change", () => act("jump", {kind: "at", slug: jump.value}));
for (const id of ["previous", "next", "replay"]) document.getElementById(id).addEventListener("click", () => act(id));
document.addEventListener("keydown", (e) => {
  const action = !(e.metaKey || e.ctrlKey || e.altKey) && M.keys[e.key];  // Cmd/Ctrl+R stay the browser's reload
  if (!action) return;
  e.preventDefault();  // a focused jump list never also moves its own selection
  if (!e.repeat) act(action);  // a held key or a repeating clicker advances once
});
highlight();
show(showFor(position));
</script></body></html>
