name: CI
on:
  push:
  pull_request:
concurrency:  # a newer push supersedes a running check of the same branch
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - uses: actions/cache@v4
        with:
          path: .tinytex
          key: tinytex-${{ runner.os }}-${{ hashFiles('setup.sh') }}
      - uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - run: ./setup.sh --dev
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pyright
      - run: uv run pytest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/
